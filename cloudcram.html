<style>
:root{--bg:#f2f6ff;--tx:#0f1b33;--mu:#5a6b86;--card:rgba(255,255,255,.74);--bd:rgba(255,255,255,.75);--sh:0 10px 30px rgba(40,70,160,.12);--tr:rgba(100,116,139,.2);--c0:#3b82f6;--c1:#8b5cf6;--c2:#10b981;--ok:#10b981;--no:#f43f5e;--wn:#f59e0b;--tint:rgba(79,110,247,.1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080d1c;--tx:#e8eeff;--mu:#93a4c3;--card:rgba(24,33,58,.66);--bd:rgba(148,163,184,.17);--sh:0 10px 30px rgba(0,0,0,.4);--tr:rgba(148,163,184,.2);--tint:rgba(99,130,255,.16)}}
:root[data-theme="dark"]{--bg:#080d1c;--tx:#e8eeff;--mu:#93a4c3;--card:rgba(24,33,58,.66);--bd:rgba(148,163,184,.17);--sh:0 10px 30px rgba(0,0,0,.4);--tr:rgba(148,163,184,.2);--tint:rgba(99,130,255,.16)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.bl{position:fixed;border-radius:50%;filter:blur(80px);opacity:.42;z-index:-1;animation:dr 18s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(60px,40px) scale(1.2)}}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{50%{transform:scale(1.035)}}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fl{50%{transform:translateY(-9px)}}@keyframes tw{50%{opacity:.25}}@keyframes pl{to{r:11;opacity:0}}@keyframes bd{50%{transform:translateY(-4px)}}
.in{animation:up .45s both}
main{max-width:680px;margin:0 auto;padding:12px 14px 120px}
.glass{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:22px}
.ban{padding:8px 12px;font-size:11.5px;text-align:center;color:var(--mu);margin-bottom:12px;border-radius:14px}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px;color:#fff;margin-bottom:14px;background:radial-gradient(120% 140% at 0% 0%,#1d4ed8 0%,#4338ca 42%,#0b1226 100%);box-shadow:0 18px 40px rgba(67,56,202,.35)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:26px 26px;-webkit-mask:radial-gradient(90% 90% at 80% 20%,#000,transparent);mask:radial-gradient(90% 90% at 80% 20%,#000,transparent)}
.hero>*{position:relative}.hr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.03em}.hero h1 span{color:#7dd3fc}
.hero small{color:#c7d2fe;display:block}
.cl{animation:fl 5s ease-in-out infinite;filter:drop-shadow(0 12px 18px rgba(0,0,0,.35))}.tw{animation:tw 2.4s infinite}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:12px;align-items:center}
.pills>span{background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border-radius:99px;padding:5px 12px;display:inline-flex;gap:5px;align-items:center}
.xp{height:6px;width:70px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,#fde68a,#fb923c);transition:width .6s}
.tg{position:absolute!important;right:14px;top:14px;background:rgba(255,255,255,.16);border:0;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.ic{vertical-align:middle;flex:none}
h2{font-size:19px;line-height:1.35;margin:0 0 12px;font-weight:700}h3{margin:0 0 8px;font-size:16px}p{margin:6px 0}.mu{color:var(--mu);font-size:14px}
.card{padding:18px;margin-bottom:14px}
.chip{display:inline-block;color:#fff;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.dots{display:flex;gap:4px}.dots i{width:9px;height:9px;border-radius:50%}.dots .g{background:var(--ok)}.dots .r{background:var(--no)}
.tip{display:flex;gap:10px;align-items:center;padding:10px 14px;margin-bottom:12px;font-size:14px;border-radius:16px}
.q{position:relative;overflow:hidden}.q::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--a)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:16px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer;min-height:52px;transition:.2s}
.opt:hover{transform:translateY(-2px);box-shadow:var(--sh)}.opt b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:#4f6ef7;flex:none;font-size:14px}
.opt.ok{border-color:var(--ok);background:rgba(16,185,129,.14);animation:pop .4s}.opt.ok b{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:rgba(244,63,94,.12);animation:shk .35s}.opt.no b{background:var(--no);color:#fff}.opt.dim{opacity:.55}
.ex{margin-top:12px;padding:14px;border-radius:16px;background:var(--tint);animation:up .4s both}.ex p{font-size:14.5px}
button{font:inherit}.btn,.pri{cursor:pointer;border-radius:14px;padding:11px 18px;min-height:46px;border:1px solid var(--bd);color:var(--tx);background:var(--card);font-weight:700;transition:.2s}
.pri{background:linear-gradient(120deg,#2563eb,#6d28d9);border:0;color:#fff;box-shadow:0 8px 20px rgba(79,70,229,.35)}.btn:hover,.pri:hover{transform:translateY(-2px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);min-height:44px;max-width:100%}
.flip{perspective:1000px;cursor:pointer;margin-bottom:14px}.fi{position:relative;height:250px;transition:transform .6s;transform-style:preserve-3d}.flip.on .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:22px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 16px 36px rgba(37,99,235,.3)}
.f1{background:linear-gradient(135deg,#2563eb,#6d28d9)}.f2{background:linear-gradient(135deg,#059669,#0d9488);transform:rotateY(180deg)}.face p{font-size:19px;font-weight:700;margin:0}.face small{opacity:.8}
.bar{height:10px;border-radius:9px;background:var(--tr);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;transition:width .7s}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{padding:14px;text-align:center}.stat b{display:block;font-size:30px;line-height:1.1;font-weight:800}
.rg{position:relative;margin:0 auto}.rg span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:14px}
.gauge{width:100%;max-width:300px;display:block;margin:0 auto}.vd{display:inline-flex;gap:6px;align-items:center;border-radius:99px;padding:6px 14px;font-weight:800;font-size:14px}
.vd.ok{background:rgba(16,185,129,.15);color:#059669}.vd.no{background:rgba(244,63,94,.14);color:#e11d48}.vd.wn{background:rgba(245,158,11,.16);color:#b45309}
.tl{position:relative;display:flex;gap:14px;padding-bottom:16px}.tl:last-child{padding-bottom:0}
.tl::before{content:"";position:absolute;left:7px;top:18px;bottom:-2px;width:2px;background:var(--tr)}.tl:last-child::before{display:none}
.tl i{width:16px;height:16px;border-radius:50%;margin-top:4px;flex:none;box-shadow:0 0 0 4px var(--bg)}.tl p{margin:0;font-size:14.5px}
.chat{max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.m{display:flex;gap:8px;animation:up .35s both}.m.u{justify-content:flex-end}.m>p{max-width:84%;margin:0;padding:10px 14px;border-radius:18px;font-size:14.5px;background:var(--tint)}
.m.u>p{background:linear-gradient(120deg,#2563eb,#6d28d9);color:#fff}.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;display:grid;place-items:center;flex:none}
.ty i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mu);animation:bd 1s infinite}.ty i:nth-child(2){animation-delay:.15s}.ty i:nth-child(3){animation-delay:.3s}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}.chips button{flex:none;font-size:13px;padding:7px 14px;border-radius:99px;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
ul{margin:6px 0 0;padding-left:20px;font-size:14.5px}li{margin:4px 0}a{color:#4f6ef7}
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:460px;margin:auto;display:flex;padding:6px;z-index:5}
nav button{flex:1;border:0;background:none;border-radius:17px;padding:8px 2px;font-size:11px;font-weight:700;color:var(--mu);cursor:pointer;transition:.25s}
nav button.on{background:linear-gradient(120deg,#2563eb,#6d28d9);color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.4)}nav .ic{display:block;margin:0 auto 2px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}#fx i{position:absolute;width:9px;height:9px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const DOM=[`Cloud concepts`,`Azure architecture & services`,`Management & governance`],DC=[`#3b82f6`,`#8b5cf6`,`#10b981`],WT=[.275,.375,.325];
const Q=[{"id": "seed-0", "domain": 0, "stem": "In an IaaS deployment, who is responsible for patching the guest operating system?", "options": ["Nobody; it patches itself", "The customer", "Microsoft", "Both equally, always"], "correct": 1, "explanation": "With IaaS, Microsoft manages the physical datacenter, network and hypervisor. You manage the OS, patches, apps and data. With PaaS the OS moves to Microsoft; with SaaS almost everything does."}, {"id": "seed-1", "domain": 0, "stem": "A business pays only for the compute it uses each month, with no upfront hardware purchase. Which expense type is this?", "options": ["Operational expenditure (OpEx)", "Reserved depreciation", "Fixed licensing", "Capital expenditure (CapEx)"], "correct": 0, "explanation": "The consumption-based model turns upfront CapEx into pay-as-you-go OpEx. You are billed for what you use."}, {"id": "seed-2", "domain": 0, "stem": "An online shop’s traffic spikes on a sale day, so extra resources are added automatically and removed afterwards. Which cloud benefit is this?", "options": ["Data sovereignty", "Elasticity", "Compliance", "Disaster recovery"], "correct": 1, "explanation": "Elasticity (a form of scalability) means resources grow and shrink automatically with demand, so you don’t pay for idle capacity."}, {"id": "seed-3", "domain": 0, "stem": "Which of these is an example of Software as a Service (SaaS)?", "options": ["Azure Kubernetes Service", "Microsoft 365", "Azure Virtual Machines", "Azure Virtual Network"], "correct": 1, "explanation": "Microsoft 365 is finished software you use over the internet. Virtual Machines are IaaS; the other two are infrastructure and container services you configure yourself."}, {"id": "seed-4", "domain": 1, "stem": "Which Azure feature protects against the failure of a single datacenter inside one region?", "options": ["Management groups", "Availability Zones", "Resource groups", "Tags"], "correct": 1, "explanation": "Availability Zones are physically separate datacenter locations within a region, each with independent power, cooling and networking."}, {"id": "seed-5", "domain": 1, "stem": "Which Azure service is designed for storing unstructured data such as images and videos?", "options": ["Azure Virtual Network", "Azure Policy", "Azure SQL Database", "Azure Blob Storage"], "correct": 3, "explanation": "Blob Storage holds massive amounts of unstructured data (objects). Azure SQL Database is for relational data."}, {"id": "seed-6", "domain": 1, "stem": "Which Azure service lets you run small pieces of code in response to events without managing servers?", "options": ["Azure Virtual Desktop", "Azure ExpressRoute", "Azure Bastion", "Azure Functions"], "correct": 3, "explanation": "Azure Functions is serverless and event-driven. You write the code; Azure handles the infrastructure and scaling."}, {"id": "seed-7", "domain": 1, "stem": "Which service provides a private, isolated network in Azure so your resources can talk to each other securely?", "options": ["Azure Advisor", "Azure Virtual Network", "Azure Monitor", "Azure DNS"], "correct": 1, "explanation": "An Azure Virtual Network (VNet) is your private network in Azure, used for communication between Azure resources, the internet and on-premises networks."}, {"id": "seed-8", "domain": 2, "stem": "Which service lets you enforce rules, such as allowing resources to be created only in approved regions?", "options": ["Azure Monitor", "Azure Advisor", "Azure Policy", "Microsoft Defender for Cloud"], "correct": 2, "explanation": "Azure Policy evaluates resources against your rules and can deny or flag non-compliant ones. It is about governance and compliance."}, {"id": "seed-9", "domain": 2, "stem": "Which feature helps stop a critical resource from being accidentally deleted?", "options": ["Azure Policy initiative", "Azure Advisor", "Availability set", "Resource lock"], "correct": 3, "explanation": "A resource lock (CanNotDelete or ReadOnly) overrides user permissions to prevent accidental deletion or changes."}, {"id": "seed-10", "domain": 2, "stem": "Which service provides single sign-on and multifactor authentication for users and apps?", "options": ["Azure Arc", "Microsoft Entra ID", "Azure Key Vault", "Azure Firewall"], "correct": 1, "explanation": "Microsoft Entra ID (formerly Azure Active Directory) is Microsoft’s cloud identity service, offering SSO, MFA and Conditional Access."}, {"id": "seed-11", "domain": 2, "stem": "Which tool estimates the monthly cost of Azure resources you plan to deploy?", "options": ["Azure Monitor", "Azure Service Health", "Azure Advisor", "Pricing calculator"], "correct": 3, "explanation": "The Pricing calculator estimates costs for planned services. The TCO calculator instead compares on-premises costs with Azure."}, {"domain": 0, "stem": "A bank must keep sensitive data in its own datacenter but wants Azure for seasonal workloads. Which cloud model fits?", "options": ["Multicloud", "Hybrid cloud", "Public cloud", "Private cloud"], "correct": 1, "explanation": "A hybrid cloud combines private or on-premises resources with a public cloud and lets workloads move between them.", "id": "seed-12"}, {"domain": 0, "stem": "Which statement best describes serverless computing?", "options": ["Your code runs on demand while the provider manages the servers", "A fixed set of servers runs all day", "You patch and manage the VMs", "You buy and rack your own hardware"], "correct": 0, "explanation": "With serverless (such as Azure Functions) you focus on code, the platform handles infrastructure and scaling, and billing follows usage.", "id": "seed-13"}, {"domain": 0, "stem": "What does a higher SLA percentage (for example 99.99% instead of 99.9%) mean?", "options": ["Less allowed downtime", "More regions", "Lower prices", "More allowed downtime"], "correct": 0, "explanation": "An SLA states expected uptime. A higher percentage means less downtime is allowed per month or year.", "id": "seed-14"}, {"domain": 0, "stem": "Which is an example of manageability in the cloud?", "options": ["Buying extra servers each year", "Deploying resources from templates and monitoring them with alerts", "Replacing hardware every three years", "Printing server logs"], "correct": 1, "explanation": "Manageability means managing and monitoring resources through automation, templates, dashboards and alerts.", "id": "seed-15"}, {"domain": 0, "stem": "Which of these is Platform as a Service (PaaS)?", "options": ["Azure App Service", "Dynamics 365", "Microsoft 365", "Azure Virtual Machines"], "correct": 0, "explanation": "App Service lets you deploy web apps without managing the OS. VMs are IaaS; Microsoft 365 and Dynamics 365 are SaaS.", "id": "seed-16"}, {"domain": 0, "stem": "A company wants to move a legacy app to the cloud unchanged and keep full control of the operating system. Which service type fits best?", "options": ["Serverless", "SaaS", "PaaS", "IaaS"], "correct": 3, "explanation": "IaaS gives you virtual machines where you control the OS and software, which suits lift-and-shift migrations.", "id": "seed-17"}, {"domain": 1, "stem": "What is a benefit of Azure region pairs?", "options": ["VMs are copied automatically", "Both regions share one datacenter", "Data transfer between them is always free", "Updates are staged one at a time and recovery is prioritised across the pair"], "correct": 3, "explanation": "Paired regions are in the same geography. Planned updates roll out sequentially and one region is prioritised in a wide outage.", "id": "seed-18"}, {"domain": 1, "stem": "Azure Government is an example of what?", "options": ["A resource group", "An availability zone", "A management group", "A sovereign region"], "correct": 3, "explanation": "Sovereign regions are isolated instances of Azure, such as Azure Government, built for specific compliance or legal needs.", "id": "seed-19"}, {"domain": 1, "stem": "Which lists Azure scopes from largest to smallest?", "options": ["Management group, subscription, resource group, resource", "Resource group, subscription, management group, resource", "Subscription, management group, resource group, resource", "Resource, resource group, management group, subscription"], "correct": 0, "explanation": "Management groups contain subscriptions, subscriptions contain resource groups, and resource groups contain resources.", "id": "seed-20"}, {"domain": 1, "stem": "What happens to the resources inside a resource group when you delete the group?", "options": ["They are all deleted", "They move to a default group", "Nothing happens to them", "Only empty ones are deleted"], "correct": 0, "explanation": "Deleting a resource group deletes every resource in it, so group resources that share a lifecycle.", "id": "seed-21"}, {"domain": 1, "stem": "Which compute option packages an app with its dependencies and shares the host operating system kernel?", "options": ["Azure Virtual Desktop", "Availability sets", "Virtual Machine Scale Sets", "Containers"], "correct": 3, "explanation": "Containers are lighter than VMs because they share the host OS kernel rather than each running a full guest OS.", "id": "seed-22"}, {"domain": 1, "stem": "Which service automatically adds or removes identical VMs as load changes?", "options": ["Azure Bastion", "Availability set", "Azure Arc", "Virtual Machine Scale Sets"], "correct": 3, "explanation": "Virtual Machine Scale Sets manage a group of identical load-balanced VMs and can autoscale them.", "id": "seed-23"}, {"domain": 1, "stem": "Which VM option spreads VMs across fault domains and update domains inside a datacenter?", "options": ["Azure DNS", "Availability sets", "Resource locks", "Tags"], "correct": 1, "explanation": "Availability sets reduce the impact of hardware failures and maintenance by separating VMs into fault and update domains.", "id": "seed-24"}, {"domain": 1, "stem": "Which service connects your on-premises network to Azure over a private connection that does not use the public internet?", "options": ["Virtual network peering", "ExpressRoute", "Azure DNS", "VPN Gateway"], "correct": 1, "explanation": "ExpressRoute uses a private connection through a connectivity provider. VPN Gateway sends encrypted traffic over the internet.", "id": "seed-25"}, {"domain": 1, "stem": "What does a private endpoint do?", "options": ["Gives an Azure service a private IP address in your virtual network", "Encrypts managed disks", "Assigns tags to resources", "Creates a VPN to another cloud"], "correct": 0, "explanation": "A private endpoint brings a service such as Storage into your VNet through a private IP, keeping traffic off the public internet.", "id": "seed-26"}, {"domain": 1, "stem": "Which blob access tier has the lowest storage cost for rarely used data, but retrieval can take hours?", "options": ["Hot", "Cool", "Cold", "Archive"], "correct": 3, "explanation": "Archive is the cheapest to store, but data must be rehydrated before use. Hot suits frequent access.", "id": "seed-27"}, {"domain": 1, "stem": "Which redundancy option copies data synchronously across three availability zones in the primary region?", "options": ["GRS", "ZRS", "RA-GRS", "LRS"], "correct": 1, "explanation": "Zone-redundant storage (ZRS) spreads copies across zones. LRS keeps all copies in one datacenter.", "id": "seed-28"}, {"domain": 1, "stem": "Which Azure Storage service offers managed file shares you can access over SMB?", "options": ["Azure Files", "Blob Storage", "Queue Storage", "Table Storage"], "correct": 0, "explanation": "Azure Files provides fully managed cloud file shares accessible with SMB (and NFS).", "id": "seed-29"}, {"domain": 1, "stem": "Which offline physical device helps move very large amounts of data into Azure?", "options": ["Azure File Sync", "AzCopy", "Azure Storage Explorer", "Azure Data Box"], "correct": 3, "explanation": "Azure Data Box is a shipped storage device for bulk transfers. AzCopy and Storage Explorer transfer over the network.", "id": "seed-30"}, {"domain": 1, "stem": "Which Azure capability controls who can perform which actions at a chosen scope?", "options": ["Azure RBAC", "Resource locks", "Azure Policy", "Tags"], "correct": 0, "explanation": "Role-based access control assigns roles to users, groups or apps at a scope. Policy controls resource properties instead.", "id": "seed-31"}, {"domain": 1, "stem": "Which is an example of passwordless authentication?", "options": ["A shared password", "Windows Hello for Business", "Password plus SMS code", "Security questions"], "correct": 1, "explanation": "Passwordless methods include Windows Hello for Business, FIDO2 security keys and the Microsoft Authenticator app.", "id": "seed-32"}, {"domain": 1, "stem": "Which feature can require MFA only when a user signs in from an unfamiliar location?", "options": ["Resource locks", "Availability zones", "Microsoft Entra Conditional Access", "Azure Advisor"], "correct": 2, "explanation": "Conditional Access applies if-then policies using signals such as location, device and risk.", "id": "seed-33"}, {"domain": 1, "stem": "Which principle best describes Zero Trust?", "options": ["Verify explicitly, use least privilege and assume breach", "Trust internal users only", "Trust everything inside the network", "Block all traffic"], "correct": 0, "explanation": "Zero Trust treats every request as untrusted until verified, regardless of where it comes from.", "id": "seed-34"}, {"domain": 1, "stem": "What does the defense-in-depth model recommend?", "options": ["Relying on a single strong firewall", "Hiding all resources", "Using multiple layers of protection", "Encrypting data only"], "correct": 2, "explanation": "Defense in depth layers physical, identity, perimeter, network, compute, application and data protections so one failure is not fatal.", "id": "seed-35"}, {"domain": 1, "stem": "Which service provides security posture management and threat protection for Azure and hybrid workloads?", "options": ["Microsoft Defender for Cloud", "Azure Advisor", "Azure Monitor", "Azure DNS"], "correct": 0, "explanation": "Microsoft Defender for Cloud assesses security posture, recommends fixes and protects workloads.", "id": "seed-36"}, {"domain": 2, "stem": "Which option gives a discount for committing to one or three years of Azure resource use?", "options": ["Tags", "Resource locks", "Azure Advisor", "Azure Reservations"], "correct": 3, "explanation": "Reservations trade a one- or three-year commitment for lower prices than pay-as-you-go.", "id": "seed-37"}, {"domain": 2, "stem": "What is a common use of tags?", "options": ["Organising resources and allocating costs, for example by department", "Encrypting data", "Preventing deletion", "Creating networks"], "correct": 0, "explanation": "Tags are name-value pairs that help organise resources and group costs in reports.", "id": "seed-38"}, {"domain": 2, "stem": "Which service helps you discover, classify and govern data across on-premises, multicloud and SaaS?", "options": ["Microsoft Purview", "Azure Arc", "Azure DNS", "Azure Monitor"], "correct": 0, "explanation": "Microsoft Purview provides data governance, protection and compliance tools.", "id": "seed-39"}, {"domain": 2, "stem": "Which service extends Azure management to servers and Kubernetes outside Azure?", "options": ["Azure Arc", "Azure Bastion", "Azure Advisor", "Azure Front Door"], "correct": 0, "explanation": "Azure Arc projects on-premises and other-cloud resources into Azure so you can manage them with Azure tools.", "id": "seed-40"}, {"domain": 2, "stem": "What does an ARM template provide?", "options": ["A network diagram", "Only a VM image", "A declarative JSON file for repeatable deployments", "A billing report"], "correct": 2, "explanation": "ARM templates describe the resources you want, enabling repeatable infrastructure as code through Azure Resource Manager.", "id": "seed-41"}, {"domain": 2, "stem": "Which tool gives personalised recommendations on reliability, function render(){const T=[[`quiz`,`Quiz`],[`cards`,`Cards`],[`plan`,`Plan`],[`buddy`,`Buddy`],[`ready`,`Ready`]];
$(`#nav`).innerHTML=T.map(([k,l])=>`<button class="${tab===k?`on`:``}" aria-label="${l}" onclick="go('${k}')">${ic(k,21)}${l}</button>`).join(``);
if(cur===null)nextQ();const real=S.h.filter(x=>!x.s).length,lv=1+Math.floor(real/5);let st=0;for(let i=S.h.length-1;i>=0&&S.h[i].ok;i--)st++;
const body={quiz:vQuiz,cards:vCards,plan:vPlan,buddy:vBuddy,ready:vReady}[tab]();
$(`#app`).innerHTML=`<div class="hero"><button class="tg" onclick="theme()" aria-label="Toggle theme">${ic(`moon`,18)}</button><div class="hr"><div><h1>Cloud<span>Cram</span></h1><small>AZ-900 Azure Fundamentals</small><small style="opacity:.75;font-size:12px">Unofficial study companion</small></div>${hero()}</div><div class="pills"><span>${ic(`flame`,14)} ${st} streak</span><span>${due().length} cards due</span><span>Level ${lv}<span class="xp"><i style="width:${(real%5)*20}%"></i></span></span></div></div><div class="${fx}">${body}</div>`;
fx=``;const c=$(`.chat`);if(c)c.scrollTop=c.scrollHeight;if(fb){const i=$(`#bq`);if(i)i.focus();fb=false}}
function go(t){tab=t;fx=`in`;render()}
render();
</script>
</body>
